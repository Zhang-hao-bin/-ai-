[project]
name = "life-guide-agent"
version = "0.1.0"
description = "基于高性价比人生指南的可追溯知识库问答助手"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "langchain-core>=1,<2",
  "langchain-openai>=1,<2",
  "python-dotenv>=1,<2",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
